name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Regression tests (no network) · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 26 regression tests (fake SMTP server, temp data dir)
        run: npm test
      - name: No JavaScript file over 250 lines
        run: node scripts/check-lines.mjs
      - name: Every JavaScript file parses
        run: for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
